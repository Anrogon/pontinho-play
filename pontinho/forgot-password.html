
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pontinho Play - Recuperar Senha</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #0b3c66, #0a2238);
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    .auth-card {
      width: min(92vw, 400px);
      box-sizing: border-box;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .auth-card h1 {
      margin: 0 0 18px;
      text-align: center;
      font-size: 28px;
    }

    .auth-description {
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
      color: rgba(255,255,255,0.85);
    }

    .auth-card input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.10);
      color: #fff;
      font-size: 15px;
    }

    .auth-card input::placeholder {
      color: rgba(255,255,255,0.70);
    }

    .auth-actions {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      background: #f0c14b;
      color: #1a1a1a;
    }

    .secondary {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.16);
    }

    .auth-message {
      min-height: 22px;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: #ffd38a;
    }

    @media (max-width: 600px) {
      .auth-card {
        padding: 26px 20px;
        width: min(420px, 80vw);
      }

      .auth-card h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <h1>♠ Recuperar Senha ♠</h1>

    <p class="auth-description">
      Informe o e-mail cadastrado no Pontinho Play.
      Enviaremos um link para redefinir sua senha.
    </p>

    <form id="forgotPasswordForm">
      <input
        type="email"
        id="forgotEmail"
        placeholder="Seu e-mail"
        autocomplete="email"
        required
      >

      <div class="auth-actions">
        <button
          id="btnForgotSubmit"
          class="primary"
          type="submit"
        >
          Enviar link de recuperação
        </button>

        <button
          id="btnBackLogin"
          class="secondary"
          type="button"
          onclick="window.location.href='./login.html'"
        >
          Voltar ao Login
        </button>
      </div>
    </form>

    <div
      id="authMessage"
      class="auth-message"
      role="status"
      aria-live="polite"
    ></div>
  </div>

  <script src="./js/forgot-password.js"></script>
</body>
</html>
