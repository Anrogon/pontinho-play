<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pontinho Play - Cadastro</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #0b3c66, #0a2238);
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    .auth-card {
      width: min(92vw, 420px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .auth-card h1 {
      margin: 0 0 18px;
      text-align: center;
      font-size: 28px;
    }

    .auth-card input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.10);
      color: #fff;
      font-size: 15px;
    }

    .auth-card input::placeholder {
      color: rgba(255,255,255,0.70);
    }

    .auth-actions {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      background: #06BF27;
      color: #1a1a1a;
    }

    .secondary {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    .auth-message {
      min-height: 22px;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      color: #ffd38a;
    }

    .auth-links {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
    }

    .auth-links a {
      color: #fff;
      font-weight: 700;
    }

    
  .terms-accept {
    margin: 8px 0 12px;
  }

  .terms-accept label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    line-height: 1.5;
    cursor: pointer;
  }

  .terms-accept input[type="checkbox"] {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    margin: 3px 0 0;
    accent-color: #f0c14b;
  }

  .terms-accept label > span {
    flex: 1;
  }


    .terms-accept a,
    .terms-accept a:visited {
      color: #f7c548;
      text-decoration: none;
      font-weight: 600;
    }

    .terms-accept a:hover {
      text-decoration: underline;
    }

  @media(max-width:600px){

    .auth-card{
      padding:26px 20px;
      width:min(420px,80vw);
    }

    .auth-card h1{
      font-size:30px;
    }

  }
  </style>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

</head>
<body>
  <div class="auth-card">
    <h1>♠  Cadastre-se  ♠</h1>

    <input type="text" id="signupUsername" placeholder="Seu nome de usuário">
    <input type="email" id="signupEmail" placeholder="Seu e-mail">
    <input type="password" id="signupPassword" placeholder="Crie uma senha">
    <input type="text" id="signupAvatarUrl" placeholder="URL do avatar (opcional)">

    
    <div class="terms-accept">
      <label>
        <input type="checkbox" id="acceptTerms">

        <span>
          Li e aceito os
          <a href="./terms.html" target="_blank">Termos de Uso</a>
          e a
          <a href="./privacy.html" target="_blank">Política de Privacidade</a>.
        </span>
      </label>
    </div>

        <div style="display:flex;justify-content:center;margin:16px 0;">
          <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAGEbiieqhFaAVB-J"
            data-theme="light"
          ></div>
        </div>

    <div class="auth-actions">
      <button id="btnSignupSubmit" class="primary" type="button">Criar conta</button>
      <button id="btnBackLogin" class="secondary" type="button">Voltar</button>
    </div>


    <div id="authMessage" class="auth-message"></div>

    <div class="auth-links">
      Já tem conta?
      <a href="./login.html">Entrar</a>
    </div>
  </div>

  <script>
  console.log("signup.html carregado");
</script>
<script src="./js/signup.js"></script>
</body>
</html>
